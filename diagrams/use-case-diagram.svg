<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="820" viewBox="0 0 1280 820" role="img" aria-labelledby="title desc">
  <title id="title">Pharmacy Expiry and Re-order Dispatch Engine use-case diagram</title>
  <desc id="desc">Pharmacy Clerk and Inventory Supplier interact with pharmacy inventory use cases. Required purchase-order activities use include relationships; Retry Failed Dispatch extends Dispatch Purchase Order only when dispatch fails.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#27364b"/></marker>
    <style>text{font-family:Arial,sans-serif;fill:#172033}.label{font-size:17px;font-weight:bold}.small{font-size:14px}.actor{stroke:#27364b;stroke-width:2;fill:none}.link{stroke:#27364b;stroke-width:2;fill:none}.relation{stroke:#485b73;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#arrow)}.uc{fill:#f5f8fc;stroke:#285a9e;stroke-width:2}.boundary{fill:#fbfdff;stroke:#6385b7;stroke-width:2}</style>
  </defs>
  <rect class="boundary" x="235" y="30" width="810" height="755" rx="8"/>
  <text x="640" y="61" text-anchor="middle" class="label">Pharmacy Expiry &amp; Re-order Dispatch Engine</text>
  <circle class="actor" cx="100" cy="235" r="18"/><path class="actor" d="M100 253V312M73 272H127M100 312L73 350M100 312L127 350"/><text x="100" y="380" text-anchor="middle" class="label">Pharmacy Clerk</text>
  <circle class="actor" cx="1180" cy="615" r="18"/><path class="actor" d="M1180 633V692M1153 652H1207M1180 692L1153 730M1180 692L1207 730"/><text x="1180" y="760" text-anchor="middle" class="label">Inventory Supplier</text>
  <ellipse class="uc" cx="410" cy="125" rx="125" ry="38"/><text x="410" y="131" text-anchor="middle">Record Batch Receipt</text>
  <ellipse class="uc" cx="710" cy="125" rx="115" ry="38"/><text x="710" y="131" text-anchor="middle">Monitor Batch Expiry</text>
  <ellipse class="uc" cx="410" cy="240" rx="130" ry="42"/><text x="410" y="235" text-anchor="middle">Generate FEFO</text><text x="410" y="256" text-anchor="middle">Dispensing List</text>
  <ellipse class="uc" cx="710" cy="240" rx="125" ry="42"/><text x="710" y="235" text-anchor="middle">Check Re-order</text><text x="710" y="256" text-anchor="middle">Threshold</text>
  <ellipse class="uc" cx="545" cy="380" rx="145" ry="45"/><text x="545" y="374" text-anchor="middle">Generate &amp; Dispatch</text><text x="545" y="395" text-anchor="middle">Purchase Order</text>
  <ellipse class="uc" cx="390" cy="525" rx="125" ry="38"/><text x="390" y="531" text-anchor="middle">Generate Purchase Order</text>
  <ellipse class="uc" cx="695" cy="525" rx="120" ry="38"/><text x="695" y="531" text-anchor="middle">Approve Purchase Order</text>
  <ellipse class="uc" cx="520" cy="650" rx="120" ry="38"/><text x="520" y="656" text-anchor="middle">Dispatch Purchase Order</text>
  <ellipse class="uc" cx="815" cy="650" rx="132" ry="42"/><text x="815" y="645" text-anchor="middle">Receive Supplier</text><text x="815" y="666" text-anchor="middle">Acknowledgement</text>
  <ellipse class="uc" cx="815" cy="745" rx="118" ry="30"/><text x="815" y="751" text-anchor="middle">Retry Failed Dispatch</text>
  <path class="link" d="M130 225L285 130M130 245L278 240M130 270L400 370M130 300L575 520M130 330L700 745"/>
  <path class="link" d="M1150 620L947 648"/>
  <path class="relation" d="M505 222L620 153"/><text x="545" y="185" class="small">«include»</text>
  <path class="relation" d="M615 335L680 278"/><text x="640" y="305" class="small">«include»</text>
  <path class="relation" d="M480 420L420 488"/><text x="420" y="458" class="small">«include»</text>
  <path class="relation" d="M610 420L670 488"/><text x="660" y="458" class="small">«include»</text>
  <path class="relation" d="M540 425L523 611"/><text x="550" y="548" class="small">«include»</text>
  <path class="relation" d="M640 650L683 650"/><text x="645" y="633" class="small">«include»</text>
  <path class="relation" d="M760 725L600 670"/><text x="650" y="715" class="small">«extend»</text>
</svg>
